name: fleet_tracker
description: Production fleet tracking driver app for India logistics
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Battery ---
  battery_plus: ^6.0.1             # Real battery level reporting

  # --- GPS ---
  geolocator: ^11.0.0             # GPS with Android/iOS background support

  # --- Background Foreground Service ---
  flutter_foreground_task: ^8.0.0 # Rock-solid foreground service (Android notification)

  # --- MQTT ---
  mqtt_client: ^10.0.0            # Paho MQTT dart port

  # --- Offline Buffer ---
  sqflite: ^2.3.3                 # SQLite local DB for offline GPS buffer
  path: ^1.9.0

  # --- Network Detection ---
  connectivity_plus: ^6.0.3       # Detect online/offline state

  # --- Secure Storage ---
  flutter_secure_storage: ^9.0.0  # Store auth tokens securely

  # --- State Management ---
  provider: ^6.1.2

  # --- UUID ---
  uuid: ^4.4.0

  # --- Utils ---
  shared_preferences: ^2.2.3      # Simple prefs (vehicle ID, driver ID etc.)
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
