version: '3.8'

services:

  # ── Mosquitto MQTT Broker ─────────────────────────────────────────────────
  # Our own broker — driver phones publish here (port 1883 plain TCP).
  # For production: enable TLS on 8883 + username/password in mosquitto.conf.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # Driver app connects here (same LAN)
      - "9001:9001"   # WebSocket (optional, for browser MQTT clients)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ── Redis Stack 7.4 (TimeSeries, Streams, JSON, Search, Bloom) ──────────────
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    build: ./redis
    expose:
      - 6379
    ports:
      - "6379:6379"
    env_file:
      - ./envs/redis.env
    volumes:
      - ./redis/:/redis/
      - redis_data:/data/
    restart: unless-stopped

  # ── Fleet Go Worker (MQTT → Redis) ────────────────────────────────────────
  # Subscribes to mosquitto, deserialises TruckEvent JSON, writes to Redis.
  mqtt:
    image: dmw2151/fleet_worker
    build:
      context: ./hslservices/
      dockerfile: ./cmd/mqtt/Dockerfile
    depends_on:
      - mosquitto
      - redis
    environment:
      MQTT_BROKER: mosquitto        # Docker service name resolves inside network
      MQTT_PORT:   "1883"
      MQTT_TOPIC:  "trucks/#"
    env_file:
      - ./envs/redis.env
    restart: unless-stopped

  # ── PostGIS 16-3.5 (official image — mdillon/postgis is archived) ─────────
  postgis:
    image: postgis/postgis:16-3.5
    expose:
      - 5432
    ports:
      - "5433:5432"
    env_file:
      - ./envs/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./postgis/:/docker-entrypoint-initdb.d

  # ── Fleet Dashboard — nginx:1.27 serving static OSM dashboard ───────────
  frontend:
    image: fleet_dashboard
    build: ./frontend/
    depends_on:
      - redis
      - mqtt
      - locations_api
    ports:
      - "8080:8080"
    env_file:
      - ./envs/hslweb.env
    restart: unless-stopped

  # ── Tile Generation Sidecar ───────────────────────────────────────────────
  tilegen:
    image: dmw2151/tilegen
    build: ./tilegen/
    depends_on:
      - postgis
    volumes:
      - tiles:/tiles
    env_file:
      - ./envs/postgres.env
    restart: unless-stopped

  # ── Locations WebSocket API ───────────────────────────────────────────────
  locations_api:
    image: dmw2151/locations_api
    build:
      context: ./hslservices/
      dockerfile: ./cmd/locations/Dockerfile
    expose:
      - 2152
    ports:
      - "2152:2152"
    depends_on:
      - redis
    env_file:
      - ./envs/redis.env

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  tiles:
